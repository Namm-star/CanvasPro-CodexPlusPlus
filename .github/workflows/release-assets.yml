name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CanvasPro release tag
        required: true
        type: string
      platform:
        description: Platforms to build
        type: choice
        default: all
        options: [all, windows, macos]
      draft:
        description: Keep installers in a draft until checks finish
        type: boolean
        default: true
      publish:
        description: Publish the verified draft when both installers are ready
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  NO_PROXY: 127.0.0.1,localhost,::1

concurrency:
  group: canvaspro-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    if: github.event_name == 'release' || inputs.platform != 'macos'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            # Chocolatey 可能在下载失败后返回成功，必须实际验证编译器。
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $makensis) {
              $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
              if ($command) { $makensis = $command.Source }
            }
            if ($makensis) {
              & $makensis /VERSION
              if ($LASTEXITCODE -eq 0) { break }
            }
            $makensis = $null
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $makensis) { throw "NSIS 安装失败或编译器不可用，停止发布构建。" }

      - name: Frontend verification and build
        working-directory: apps/codex-plus-manager
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run vite:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unified application
        run: cargo build --release --locked
      - name: Verify CanvasPro configuration and updater
        run: |
          cargo test -p codex-plus-core --release --locked --test all canvaspro_defaults::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p codex-plus-core --release --locked --test all updater::
      - name: Stage Windows app and source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=$env:RELEASE_TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,ATTRIBUTION.md dist/windows/app/
          Copy-Item docs/CANVASPRO.md dist/windows/app/CanvasPro使用说明.md
          New-Item -ItemType Directory -Force dist/windows/app/images | Out-Null
          Copy-Item docs/images/canvaspro-support-group-20261029.png dist/windows/app/images/
          if ((Get-ChildItem dist/windows/app -Filter *.exe).Count -ne 1) { throw 'Expected one unified application' }
          Compress-Archive -Path dist/windows/app/* -DestinationPath "dist/windows/CanvasPro-CodexPlusPlus-$version-windows-x64.zip"
          git archive --format=zip --output="dist/windows/CanvasPro-CodexPlusPlus-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG).TrimStart("v", "V")
          # NSIS 的 64 位安装目录与 Chocolatey PATH 更新均需要兼容。
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $makensis) {
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { $makensis = $command.Source }
          }
          if (-not $makensis) {
            throw "NSIS 编译器未找到，检查 Chocolatey 安装结果。"
          }
          Push-Location scripts/installer/windows
          try {
            & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Record Windows provenance
        run: node scripts/canvaspro-release-manifest.mjs dist/windows windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: canvaspro-windows-x64
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*manifest.json
            dist/windows/SHA256SUMS-*.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          files: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*manifest.json
            dist/windows/SHA256SUMS-*.txt

  macos-dmg:
    name: macOS universal DMG
    if: github.event_name == 'release' || inputs.platform != 'windows'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Frontend build
        working-directory: apps/codex-plus-manager
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run vite:build
      - name: Build universal DMG with ad-hoc signing
        run: |
          VERSION="${RELEASE_TAG#v}"
          bash scripts/installer/macos/build-universal.sh "$VERSION"
      - name: Verify native configuration and updater
        run: |
          cargo test -p codex-plus-core --release --locked --target aarch64-apple-darwin --test all canvaspro_defaults::
          cargo test -p codex-plus-core --release --locked --target aarch64-apple-darwin --test all updater::
      - name: Verify universal bundles and disk image
        run: |
          set -euo pipefail
          for app in "dist/macos/stage/Codex++.app" "dist/macos/stage/Codex++ 管理工具.app"; do
            plutil -lint "$app/Contents/Info.plist"
            test -f "$app/Contents/Resources/LICENSE"
            test -f "$app/Contents/Resources/ATTRIBUTION.md"
            test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            lipo "$app/Contents/MacOS/$executable" -verify_arch x86_64 arm64
            codesign --verify --deep --strict "$app"
          done
          test -L dist/macos/stage/Applications
          for dmg in dist/macos/*.dmg; do hdiutil verify "$dmg"; done
          node scripts/canvaspro-release-manifest.mjs dist/macos macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: canvaspro-macos-universal
          path: |
            dist/macos/*.dmg
            dist/macos/*manifest.json
            dist/macos/SHA256SUMS-*.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          files: |
            dist/macos/*.dmg
            dist/macos/*manifest.json
            dist/macos/SHA256SUMS-*.txt

  latest-json:
    name: Verify release provenance and publish metadata
    needs: [windows-installer, macos-dmg]
    if: always() && !cancelled() && (needs.windows-installer.result == 'success' || needs.windows-installer.result == 'skipped') && (needs.macos-dmg.result == 'success' || needs.macos-dmg.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify installers and matching source commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets,body,tagName > release.json
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern '*-build-manifest.json'
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const version = release.tagName.replace(/^v/, '');
          const prefix = `CanvasPro-CodexPlusPlus-${version}`;
          const expected = [`${prefix}-windows-x64-setup.exe`, `${prefix}-windows-x64.zip`, `${prefix}-macos-universal.dmg`, `${prefix}-source.zip`, 'windows-x64-build-manifest.json', 'macos-universal-build-manifest.json', 'SHA256SUMS-windows-x64.txt', 'SHA256SUMS-macos-universal.txt'];
          for (const name of expected) {
            if (!release.assets.some(a => a.name === name && a.size > 0 && a.state === 'uploaded')) throw new Error(`Missing verified asset: ${name}`);
          }
          const sourceCommit = execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim();
          for (const platform of ['windows-x64','macos-universal']) {
            const manifest = JSON.parse(fs.readFileSync(`${platform}-build-manifest.json`,'utf8'));
            if (manifest.sourceCommit !== sourceCommit || manifest.tag !== release.tagName) throw new Error('Source provenance mismatch');
            for (const asset of manifest.assets) {
              const remote = release.assets.find(a => a.name === asset.name);
              if (!remote || remote.size !== asset.bytes || remote.digest !== `sha256:${asset.sha256}`) throw new Error(`Asset digest mismatch: ${asset.name}`);
            }
          }
          const repo = process.env.REPO;
          const tag = release.tagName;
          const payload = {version:tag,url:`https://github.com/${repo}/releases/tag/${tag}`,body:release.body,assets:release.assets.filter(a=>a.name!=='latest.json').map(a=>({name:a.name,url:`https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(a.name)}`}))};
          fs.writeFileSync('latest.json', JSON.stringify(payload,null,2)+'\n');
          NODE
          TAG="$RELEASE_TAG"
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
      - name: Publish verified draft
        if: github.event_name == 'workflow_dispatch' && inputs.draft && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag --repo "$REPO"
