name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build missing installers for
        required: true
        type: string
        default: v1.5.0-canvaspro.1

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: canvaspro-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  asset-plan:
    name: Preserve uploaded installers
    runs-on: ubuntu-latest
    outputs:
      windows-needed: ${{ steps.assets.outputs.windows-needed }}
      macos-needed: ${{ steps.assets.outputs.macos-needed }}
    steps:
      - name: Check release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo 'error: invalid release tag' >&2
            exit 1
          fi
          gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha'
          version="${TAG#v}"
          version="${version#V}"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > assets.txt
          if grep -Fxq "CanvasPro-CodexPlusPlus-${version}-windows-x64-setup.exe" assets.txt; then
            echo 'windows-needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'windows-needed=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq "CanvasPro-CodexPlusPlus-${version}-macos-x64.dmg" assets.txt && grep -Fxq "CanvasPro-CodexPlusPlus-${version}-macos-arm64.dmg" assets.txt; then
            echo 'macos-needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'macos-needed=true' >> "$GITHUB_OUTPUT"
          fi

  windows-installer:
    needs: asset-plan
    if: needs.asset-plan.outputs.windows-needed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --locked

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/windows/app/

      - name: Build Windows zip asset
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart("v", "V")
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,ATTRIBUTION.md dist/windows/app/
          Copy-Item docs/CANVASPRO.md dist/windows/app/CanvasPro使用说明.md
          Compress-Archive -Path dist/windows/app/* -DestinationPath "dist/windows/CanvasPro-CodexPlusPlus-$version-windows-x64.zip" -Force
          git archive --format=zip --output="dist/windows/CanvasPro-CodexPlusPlus-$version-source.zip" HEAD

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart("v", "V")
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
          Pop-Location

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/windows/*.exe
            dist/windows/*.zip

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: asset-plan
    if: needs.asset-plan.outputs.macos-needed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify CanvasPro native configuration
        run: cargo test -p codex-plus-core --test canvaspro_defaults --release --locked --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION#V}"
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Build macOS zip asset
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION#V}"
          mkdir -p dist/macos/app-${{ matrix.arch }}
          cp "target/${{ matrix.target }}/release/codex-plus-plus" "dist/macos/app-${{ matrix.arch }}/"
          cp "target/${{ matrix.target }}/release/codex-plus-plus-manager" "dist/macos/app-${{ matrix.arch }}/"
          cp LICENSE THIRD_PARTY_NOTICES.md ATTRIBUTION.md "dist/macos/app-${{ matrix.arch }}/"
          cp docs/CANVASPRO.md "dist/macos/app-${{ matrix.arch }}/CanvasPro使用说明.md"
          (cd dist/macos && zip -r "CanvasPro-CodexPlusPlus-${VERSION}-macos-${{ matrix.arch }}.zip" "app-${{ matrix.arch }}")

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Codex++.app" "dist/macos/stage/Codex++ 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -f "$app/Contents/Resources/LICENSE"
            test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
            test -f "$app/Contents/Resources/ATTRIBUTION.md"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign -dv "$app" >/dev/null 2>&1
            codesign --verify --deep --strict "$app"
            echo "verified: $app"
          done
          architecture='${{ matrix.arch }}'
          if [ "$architecture" = 'x64' ]; then architecture='x86_64'; fi
          lipo "target/${{ matrix.target }}/release/codex-plus-plus" -verify_arch "$architecture"
          lipo "target/${{ matrix.target }}/release/codex-plus-plus-manager" -verify_arch "$architecture"
          for dmg in dist/macos/*.dmg; do hdiutil verify "$dmg"; done

      - name: Record macOS build checksums and provenance
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export RUST_VERSION="$(rustc --version)"
          export MACOS_VERSION="$(sw_vers -productVersion)"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const arch = process.env.BUILD_ARCH;
          const files = fs.readdirSync('dist/macos').filter(name => /\.(dmg|zip)$/.test(name)).sort();
          const assets = files.map(name => {
            const bytes = fs.readFileSync(`dist/macos/${name}`);
            return { name, bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          const manifest = {
            tag: process.env.RELEASE_TAG, sourceCommit: process.env.SOURCE_COMMIT,
            architecture: arch, target: process.env.BUILD_TARGET,
            rust: process.env.RUST_VERSION, macOS: process.env.MACOS_VERSION,
            signing: 'ad-hoc', appleNotarized: false,
            validation: { canvasProNativeConfigurationTests: 'passed', binaryArchitecture: 'passed', codeSignature: 'passed', dmgIntegrity: 'passed' },
            assets
          };
          const manifestName = `macos-${arch}-build-manifest.json`;
          const manifestBytes = Buffer.from(JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync(`dist/macos/${manifestName}`, manifestBytes);
          const sums = assets.map(asset => `${asset.sha256}  ${asset.name}`);
          sums.push(`${crypto.createHash('sha256').update(manifestBytes).digest('hex')}  ${manifestName}`);
          fs.writeFileSync(`dist/macos/SHA256SUMS-macos-${arch}.txt`, sums.join('\n') + '\n');
          NODE

      - name: Preserve verified macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canvaspro-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
            dist/macos/*build-manifest.json
            dist/macos/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Upload macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/macos/*.dmg
            dist/macos/*.zip
            dist/macos/*build-manifest.json
            dist/macos/SHA256SUMS-*.txt

  latest-json:
    name: Upload static latest.json
    if: always() && !cancelled() && needs.asset-plan.result == 'success' && (needs.windows-installer.result == 'success' || needs.windows-installer.result == 'skipped') && (needs.macos-dmg.result == 'success' || needs.macos-dmg.result == 'skipped')
    runs-on: ubuntu-latest
    needs:
      - asset-plan
      - windows-installer
      - macos-dmg
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            url: release.url || `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"
